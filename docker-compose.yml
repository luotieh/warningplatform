# warning-platform 离线部署 compose（老旧内网机 / ARM64）
#
# 用法：
#   1) 在目标机器先加载本地镜像（勿拉取远程）：
#      docker load -i warning-platform-dev.20260810.2-arm64.tar
#   2) 确认配置文件存在：/data/app/config/warning-v2.toml
#      （内含 [traffic] MySQL 连接、evidence_nodes、LLM 配置等）
#   3) 启动：
#      docker compose -f docker-compose.warning-platform.yml up -d --pull never
#   4) 查看日志/健康：
#      docker compose -f docker-compose.warning-platform.yml logs -f warning-platform
#      curl http://127.0.0.1:22123/api/traffic/healthz
#
# 回滚：docker compose stop warning-platform && docker compose rm warning-platform
#       再用旧镜像/旧容器参数重新创建即可。

services:
  warning-platform:
    image: warning-platform:dev.20260810.2
    container_name: warning-platform-v2
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口，按目标机器实际规划调整（180 服务器使用 22123）
      - "22125:8080"
    volumes:
      # 运行配置：新版本依赖 [traffic] store_backend=mysql / evidence_nodes / llm。
      # 必须可写（去掉 :ro），否则“保存LLM/MySQL配置”会报 read-only file system。
      - /data/app/config/warning-v2.toml:/app/config.toml
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      # 如旧容器还有其它环境变量（从 docker inspect 复制），在此追加
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/traffic/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 可选：内网机没有现成 MySQL 时启用（mysql:8.0 镜像需提前 docker load，离线不拉取）。
  # 启动时加 --profile mysql，例如：
  #   docker compose -f docker-compose.warning-platform.yml --profile mysql up -d --pull never
  mysql:
    image: mysql:8.0
    container_name: warning-platform-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "change-me-root"
      MYSQL_DATABASE: warning_platform
      MYSQL_USER: wp
      MYSQL_PASSWORD: "change-me-wp"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchange-me-root"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
