name: 统一构建与部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

env:
  ORGANIZE: warning-platform
  APP_NAME: warning-platform
  MODE: dev
  WIRE: true

jobs:
  building:
    runs-on: code
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      commit_short: ${{ steps.meta.outputs.commit_short }}
      commit_msg: ${{ steps.meta.outputs.commit_msg }}
    steps:
      - name: (1) 代码签出
        uses: https://code.yt-security.com/public/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: (2) 变量初始化
        id: meta
        run: |
          COMMIT_SHORT=$(git rev-parse --short=6 HEAD)
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

          TAG="${MODE}.$(date +%Y%m%d).${COMMIT_SHORT}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          IMAGE="code.yt-security.com/${ORGANIZE}/${APP_NAME}:${TAG}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n1 | sed 's/["'\''\\]//g')
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: (3) 构建前端
        run: |
          cd vulnscan-frontend
          rm -rf node_modules 2>/dev/null || true
          pnpm install --config.fund=false

          export NODE_OPTIONS="--max-old-space-size=24576"
          export GENERATE_SOURCEMAP=false
          pnpm run build:prod

          echo "✅ 前端构建完成（产物直接输出到 vulnscan-backend/frontend/dist）"
          ls -la ../vulnscan-backend/frontend/dist/

      - name: (4) 构建后端二进制
        id: build
        run: |
          cd vulnscan-backend
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export PATH=$PATH:$(go env GOPATH)/bin
          go mod tidy

          if [ "$WIRE" = "true" ]; then
            wire ./di
          fi

          GO_VERSION=$(go version | awk '{print $3}')
          LDFLAGS="-s -w -extldflags '-static'"
          LDFLAGS+=" -X 'vulnscan-backend/boot.BuildTime=${BUILD_TIME}'"
          LDFLAGS+=" -X 'vulnscan-backend/boot.BuildHash=${{ steps.meta.outputs.commit_short }}'"
          LDFLAGS+=" -X 'vulnscan-backend/boot.GoVersion=${GO_VERSION}'"
          LDFLAGS+=" -X 'vulnscan-backend/boot.BuildCommit=${{ steps.meta.outputs.commit_msg }}'"
          LDFLAGS+=" -X 'vulnscan-backend/boot.ProductVersion=${{ steps.meta.outputs.tag }}'"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -trimpath -o ../server-amd64 ./cmd/server/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -trimpath -o ../server-arm64 ./cmd/server/main.go
          upx --best --lzma ../server-amd64 || true
          echo "✅ 后端构建完成（含嵌入前端）"
          ls -la ../server-*

      - name: (5) 准备 Docker 构建上下文
        run: |
          rm -rf deploy-templates 2>/dev/null || true
          git clone https://code.yt-security.com/public/deploy.git deploy-templates --depth 1
          chmod -R +x deploy-templates/
          cp deploy-templates/template-docker/backend ./Dockerfile

          CONFIG_SRC="vulnscan-backend/${MODE}.config.toml"
          if [ ! -f "${CONFIG_SRC}" ]; then
            echo "⚠️ ${CONFIG_SRC} 不存在，尝试 config.toml"
            CONFIG_SRC="vulnscan-backend/config.toml"
          fi
          cp "${CONFIG_SRC}" ./${MODE}.config.toml
          echo "✅ Docker 构建上下文就绪"
          echo "  - Dockerfile: ✓"
          echo "  - ${MODE}.config.toml (来源: ${CONFIG_SRC}): ✓"
          echo "  - server-amd64: $(ls -lh server-amd64 | awk '{print $5}')"
          echo "  - server-arm64: $(ls -lh server-arm64 | awk '{print $5}')"

      - name: (6) 镜像构建推送
        id: build_push
        run: |
          IMAGE=${{ steps.meta.outputs.image }}
          echo "构建并推送多架构镜像: ${IMAGE}"
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg MODE=${MODE} -t ${IMAGE} --push .
          docker buildx imagetools inspect ${IMAGE}
          echo "✅ 镜像构建和推送完成: ${IMAGE}"
          for arch in amd64 arm64; do
            docker pull --platform linux/${arch} ${IMAGE}
            docker save -o ${APP_NAME}-${arch}.tar ${IMAGE}
          done
          docker image prune -af

      - name: (7) 产物上传到 Gitea Packages
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          tar -czf ${APP_NAME}-${PACKAGE_VERSION}.tar.gz ${APP_NAME}-amd64.tar ${APP_NAME}-arm64.tar
          curl --user admin:b4385df77930334f1ebcf1274be50bc65024d56f \
            -v --location --request PUT \
            "https://code.yt-security.com/api/packages/${ORGANIZE}/generic/${APP_NAME}-${MODE}/${PACKAGE_VERSION}/${APP_NAME}-${PACKAGE_VERSION}.tar.gz" \
            --form "attachment=@${APP_NAME}-${PACKAGE_VERSION}.tar.gz"
          echo "✅ 构建产物上传完成"

      - name: (8) 清理
        if: always()
        run: |
          rm -f server-* *.tar *.tar.gz *.config.toml Dockerfile 2>/dev/null
          rm -rf deploy-templates vulnscan-backend/frontend/dist/*
          echo "✅ 清理完成"

  k8s-deploy:
    needs: [building]
    runs-on: k8s
    environment:
      name: development
    steps:
      - name: (1) 准备部署
        run: |
          NAMESPACE=${APP_NAME}-${MODE}
          echo "部署: ${APP_NAME} → ${NAMESPACE}"
          echo "镜像: ${{ needs.building.outputs.image }}"
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

      - name: (2) 部署应用
        env:
          IMAGE: ${{ needs.building.outputs.image }}
          TAG: ${{ needs.building.outputs.tag }}
        run: |
          NAMESPACE=${APP_NAME}-${MODE}
          DOMAIN=${APP_NAME}.${MODE}

          cat <<'APPEOF' | sed \
            -e "s|__NAMESPACE__|${NAMESPACE}|g" \
            -e "s|__DOMAIN__|${DOMAIN}|g" \
            -e "s|__APP__|${APP_NAME}|g" \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__TAG__|${TAG}|g" \
          | kubectl apply -f -
          apiVersion: networking.istio.io/v1alpha3
          kind: Gateway
          metadata:
            name: main-gateway
            namespace: __NAMESPACE__
          spec:
            selector:
              istio: ingressgateway
            servers:
              - port:
                  number: 80
                  name: http
                  protocol: HTTP
                hosts:
                  - "__DOMAIN__.yt-security.com"
          ---
          apiVersion: networking.istio.io/v1alpha3
          kind: VirtualService
          metadata:
            name: app-vs
            namespace: __NAMESPACE__
          spec:
            hosts:
              - "__DOMAIN__.yt-security.com"
            gateways:
              - main-gateway
            http:
              - route:
                  - destination:
                      host: __APP__-backend
                      port:
                        number: 8080
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: __APP__-backend
            namespace: __NAMESPACE__
          spec:
            replicas: 1
            serviceName: __APP__-backend
            selector:
              matchLabels:
                app: __APP__-backend
            template:
              metadata:
                labels:
                  app: __APP__-backend
                  version: __TAG__
              spec:
                containers:
                  - name: __APP__
                    image: __IMAGE__
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 8080
                        name: web
                        protocol: TCP
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: __APP__-backend
            namespace: __NAMESPACE__
          spec:
            selector:
              app: __APP__-backend
            ports:
              - port: 8080
                name: web
                protocol: TCP
            type: ClusterIP
          APPEOF
          echo "✅ 应用部署完成"

      - name: (3) 验证部署
        run: |
          NAMESPACE=${APP_NAME}-${MODE}
          kubectl rollout status statefulset/${APP_NAME}-backend -n ${NAMESPACE} --timeout=120s
          echo "✅ 滚动更新完成"
          kubectl get pods -n ${NAMESPACE} -l app=${APP_NAME}-backend

      - name: (4) 部署报告
        if: always()
        run: |
          NAMESPACE=${APP_NAME}-${MODE}
          DOMAIN=${APP_NAME}.${MODE}
          echo "━━━ ${APP_NAME} 部署报告 ━━━"
          echo "状态: ${{ job.status }}"
          echo "镜像: ${{ needs.building.outputs.image }}"
          echo "提交: ${{ needs.building.outputs.commit_short }}"
          echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "地址: https://${DOMAIN}.yt-security.com:32000"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━"
          kubectl get pods,svc -n ${NAMESPACE}
