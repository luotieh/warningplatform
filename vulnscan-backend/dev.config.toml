# 流量分析（trafficAnalysis）业务子系统配置
[traffic]
  # 存储后端：mysql（默认）或 memory（仅限开发/测试，进程重启数据丢失）
  store_backend = "mysql"
  # MySQL 连接串（store_backend=mysql 时必填）；必须带 parseTime=true
  database_url = "db:1c3c2d4572236897d2e9cc90b9643424@tcp(10.20.30.144:3306)/traffic?parseTime=true&charset=utf8mb4&loc=UTC"
  # 首次启动自动建库/建表/种子（全部幂等：CREATE DATABASE/TABLE IF NOT EXISTS）
  auto_migrate = true
  # 启动时等待 MySQL 就绪的最长秒数（容器编排下 MySQL 慢启动兜底）
  db_wait_seconds = 30
  # internal 接口鉴权 key（前端 X-API-Key 默认 change-me-internal-key）
  internal_api_key = "change-me-internal-key"
  # LLM（OpenAI 兼容）配置
  llm_base_url = ""
  llm_api_key = ""
  llm_model = ""
  llm_timeout_seconds = 60
  # 消息队列：noop（默认）或 rabbitmq
  mq_backend = "noop"
  rabbitmq_url = ""
  rabbitmq_consumer_enabled = false
